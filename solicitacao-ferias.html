<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Solicitações | Central de Recursos Humanos</title>
    <style>
      :root {
        --bg: #e5e5e5;
        --panel: #f2f2f2;
        --ink: #1f1f1f;
        --muted: #6a6a6a;
        --line: rgba(0, 0, 0, 0.06);
        --soft: #f3f3f3;
        --green: #0f7b46;
      }

      * { box-sizing: border-box; }

      html, body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: var(--ink);
        font-family: Arial, sans-serif;
      }

      body {
        min-height: 100vh;
      }

      button, input, select {
        font: inherit;
      }

      .request-page {
        width: 100%;
        min-height: 100vh;
        background: var(--bg);
      }

      .request-header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 24px;
        min-height: 118px;
        padding: 16px 36px 14px 26px;
      }

      .brand-zone {
        display: flex;
        align-items: center;
        justify-content: center;
        min-width: 0;
        flex: 0 0 auto;
      }

      .brand-image {
        display: block;
        width: 170px;
        height: auto;
        max-width: 100%;
        filter: drop-shadow(0 2px 0 rgba(255,255,255,0.65));
      }

      .request-tabs {
        display: flex;
        align-items: center;
        justify-content: center;
        flex: 1;
        gap: 52px;
        padding: 0 18px;
      }

      .tab-link {
        border: none;
        background: transparent;
        padding: 0;
        color: rgba(0, 0, 0, 0.72);
        font-size: 18px;
        font-weight: 700;
        letter-spacing: 0.02em;
        text-transform: uppercase;
        cursor: pointer;
        opacity: 0.9;
        transition: opacity 0.15s ease, transform 0.15s ease;
      }

      .tab-link:hover {
        opacity: 1;
      }

      .tab-link.active {
        color: #1f1f1f;
      }

      .user-box {
        display: flex;
        align-items: center;
        gap: 10px;
        min-width: 170px;
        justify-content: flex-end;
        color: #1f1f1f;
        font-size: 14px;
        font-weight: 600;
      }

      .user-avatar {
        display: grid;
        place-items: center;
        width: 34px;
        height: 34px;
        background: #0d7c48;
        border-radius: 50%;
        color: white;
        font-size: 18px;
        box-shadow: inset 0 0 0 2px rgba(255,255,255,0.7);
      }

      .user-name {
        max-width: 150px;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }

      .logout-button {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        padding: 8px 10px;
        border: 1px solid rgba(0, 0, 0, 0.12);
        border-radius: 8px;
        background: rgba(255, 255, 255, 0.45);
        color: #1f1f1f;
        font-size: 13px;
        font-weight: 700;
        text-decoration: none;
        cursor: pointer;
      }

      .user-actions { display: flex; align-items: center; gap: 8px; }

      .logout-button:hover {
        background: rgba(255, 255, 255, 0.8);
      }

      .logout-button svg {
        width: 16px;
        height: 16px;
      }

      .request-main {
        min-height: calc(100vh - 118px);
        background: rgba(255, 255, 255, 0.04);
      }

      .hidden { display: none !important; }

      .content-block {
        padding: 18px 26px 30px;
      }

      .page-title {
        margin: 0 0 18px;
        font-size: clamp(2rem, 2vw, 2.4rem);
        color: var(--ink);
        font-weight: 700;
      }

      .subtitle {
        margin: 0 0 28px;
        color: var(--muted);
        font-size: 16px;
        line-height: 1.6;
      }

      .options {
        display: grid;
        grid-template-columns: repeat(3, minmax(0, 1fr));
        gap: 18px;
      }

      .option-card {
        display: grid;
        gap: 16px;
        padding: 22px 20px;
        border: 1px solid rgba(0,0,0,0.08);
        border-radius: 18px;
        background: rgba(255,255,255,0.55);
        box-shadow: 0 8px 18px rgba(16, 26, 20, 0.05);
        cursor: pointer;
      }

      .option-card:hover {
        transform: translateY(-2px);
      }

      .option-icon {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: #eaeaea;
        color: #1f1f1f;
        font-weight: 700;
      }

      .option-card:nth-child(2) .option-icon { background: #f2ece0; }
      .option-card:nth-child(3) .option-icon { background: #ebeff0; }

      .option-card h2 {
        margin: 0;
        font-size: 1.15rem;
      }

      .option-card p {
        margin: 0;
        color: var(--muted);
        line-height: 1.5;
      }

      .option-card button {
        width: fit-content;
        min-height: 38px;
        border: none;
        border-radius: 8px;
        padding: 0 14px;
        background: var(--green);
        color: white;
        font-weight: 700;
        cursor: pointer;
      }

      .form-wrap {
        display: grid;
        gap: 18px;
        max-width: 860px;
        margin-top: 18px;
      }

      .form-grid {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 16px;
      }

      .field {
        display: grid;
        gap: 8px;
      }

      .field label {
        color: var(--muted);
        font-size: 0.8rem;
        font-weight: 700;
      }

      .field input, .field select {
        width: 100%;
        min-height: 46px;
        padding: 12px 14px;
        border: 1px solid rgba(0,0,0,0.12);
        border-radius: 10px;
        background: rgba(255,255,255,0.7);
        color: var(--ink);
        font-size: 0.96rem;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 12px;
      }

      .button {
        min-height: 44px;
        border: none;
        border-radius: 10px;
        padding: 0 18px;
        cursor: pointer;
        font-weight: 700;
      }

      .button-primary { background: var(--green); color: white; }
      .button-secondary { background: #ececec; color: #222; }

      .message {
        min-height: 22px;
        margin: 0;
        color: var(--green);
        font-weight: 700;
      }

      .message.error { color: #a0352b; }

      .conflict-warning {
        margin: 12px 0 0;
        padding: 10px 12px;
        border: 1px solid #e7c9a0;
        border-left: 4px solid #d98b2b;
        border-radius: 5px;
        background: #fdf5e8;
        color: #8a5a12;
        font-size: 0.85rem;
        font-weight: 600;
        line-height: 1.45;
      }

      @media (max-width: 940px) {
        .request-header {
          flex-wrap: wrap;
          justify-content: center;
        }

        .request-tabs {
          order: 3;
          width: 100%;
          flex-wrap: wrap;
          gap: 18px 28px;
        }

        .brand-zone, .user-box {
          min-width: unset;
        }
      }

      @media (max-width: 760px) {
        .request-header {
          min-height: auto;
          padding: 18px 16px 12px;
        }

        .brand-mark {
          width: 72px;
          height: 72px;
        }

        .brand-mark svg {
          width: 72px;
          height: 72px;
        }

        .request-tabs {
          gap: 12px 18px;
        }

        .tab-link {
          font-size: 13px;
        }

        .user-box {
          font-size: 12px;
        }

        .user-actions { flex-wrap: wrap; justify-content: center; }

        .content-block {
          padding: 16px 18px 24px;
        }

        .options, .form-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <div class="request-page">
      <header class="request-header">
        <div class="brand-zone" aria-label="Logo da Polícia Penal">
          <img class="brand-image" src="brasao_ok.png" alt="Brasão da Polícia Penal" />
        </div>

        <nav class="request-tabs" aria-label="Opções de solicitação">
          <button class="tab-link active" type="button" data-option="ferias">Solicitar férias</button>
          <button class="tab-link" type="button" data-option="premio">Licença prêmio</button>
          <button class="tab-link" type="button" data-option="capacitacao">Licença capacitação</button>
          <button class="tab-link" type="button" data-option="medica">Licença médica</button>
          <button class="tab-link" type="button" data-option="outros">Outros</button>
        </nav>

        <div class="user-box">
          <span class="user-avatar" id="user-avatar" aria-hidden="true">S</span>
          <span class="user-name" id="user-name">Servidor</span>
          <div class="user-actions">
            <a class="logout-button" href="login.html" data-logout aria-label="Sair e voltar para o login">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" x2="9" y1="12" y2="12"/></svg>
              <span>Sair</span>
            </a>
          </div>
        </div>
      </header>

      <main class="request-main">
        <div class="content-block">
          <div id="selection-panel" class="hidden"></div>

          <div id="form-panel" class="hidden">
            <h1 id="form-title" class="page-title">Solicitação</h1>
            <p id="form-subtitle" class="subtitle">Preencha os dados abaixo para encaminhar sua solicitação.</p>

            <form id="vacation-form" class="form-wrap">
              <div class="form-grid">
                <div class="field">
                  <label for="nome">Nome</label>
                  <input id="nome" name="nome" type="text" placeholder="Digite seu nome" required />
                </div>
                <div class="field">
                  <label for="email">E-mail do usuário</label>
                  <input id="email" name="email" type="email" placeholder="seuemail@empresa.com.br" required />
                </div>
                <div class="field">
                  <label for="cpf">CPF</label>
                  <input id="cpf" name="cpf" type="text" placeholder="000.000.000-00" required />
                </div>
                <div class="field">
                  <label for="unidade">Unidade de Lotação</label>
                  <select id="unidade" name="unidade" required>
                    <option value="">Selecione a unidade penal</option>
                  </select>
                  <small id="unidade-aviso" class="hidden" style="color: #b00020;"></small>
                </div>
                <div class="field">
                  <label for="equipe">Equipe</label>
                  <select id="equipe" name="equipe" required>
                    <option value="">Selecione a equipe</option>
                    <option value="Alfa">Alfa</option>
                    <option value="Bravo">Bravo</option>
                    <option value="Charlie">Charlie</option>
                    <option value="Delta">Delta</option>
                    <option value="Expediente">Expediente</option>
                  </select>
                </div>
                <div class="field" id="fg-flag-field" style="grid-column: 1 / -1;">
                  <label for="possui-fg">Possui Função Gratificada?</label>
                  <select id="possui-fg" name="possuiFg">
                    <option value="">Não</option>
                    <option value="sim">Sim</option>
                  </select>
                  <small>Selecione "Sim" caso exerça função gratificada neste período.</small>
                </div>
                <div class="field hidden" id="function-field">
                  <label for="funcao-exercida">Função exercida</label>
                  <select id="funcao-exercida" name="funcaoExercida">
                    <option value="">Selecione a função exercida</option>
                    <option value="Coordenador">Coordenador</option>
                    <option value="Diretor">Diretor</option>
                    <option value="Chefe Administrativo">Chefe Administrativo</option>
                    <option value="Chefe de Segurança">Chefe de Segurança</option>
                  </select>
                </div>
                <div class="field hidden" id="substitute-field">
                  <label for="substituto">Substituto</label>
                  <input id="substituto" name="substituto" type="text" placeholder="Informe o nome do substituto" />
                </div>
                <div class="field cycle-field hidden" id="cycle-field" style="grid-column: 1 / -1;">
                  <label for="ciclo">Qual o ciclo deseja?</label>
                  <select id="ciclo" name="ciclo" required>
                    <option value="">Selecione o ciclo</option>
                    <option value="A">Ciclo A — março, abril, maio</option>
                    <option value="B">Ciclo B — junho, julho, agosto</option>
                    <option value="C">Ciclo C — setembro, outubro, novembro</option>
                  </select>
                </div>
                <div class="field" style="grid-column: 1 / -1;">
                  <label for="data-ferias" id="data-ferias-label">Mês de férias</label>
                  <select id="data-ferias" name="data-ferias" required>
                    <option value="">Selecione o mês</option>
                    <option value="janeiro">Janeiro</option>
                    <option value="fevereiro">Fevereiro</option>
                    <option value="março">Março</option>
                    <option value="abril">Abril</option>
                    <option value="maio">Maio</option>
                    <option value="junho">Junho</option>
                    <option value="julho">Julho</option>
                    <option value="agosto">Agosto</option>
                    <option value="setembro">Setembro</option>
                    <option value="outubro">Outubro</option>
                    <option value="novembro">Novembro</option>
                    <option value="dezembro">Dezembro</option>
                  </select>
                </div>
                <div class="field hidden" id="other-type-field" style="grid-column: 1 / -1;">
                  <label for="tipo-outros">Especificar tipo de solicitação</label>
                  <input id="tipo-outros" name="tipoOutros" type="text" maxlength="80" placeholder="Ex.: licença para tratar de interesses particulares" />
                </div>
                <div class="field vacation-period-field hidden">
                  <label for="inicio-ferias" id="inicio-ferias-label">Início das férias</label>
                  <input id="inicio-ferias" name="inicioFerias" type="date" />
                </div>
                <div class="field vacation-period-field hidden">
                  <label for="fim-ferias" id="fim-ferias-label">Fim das férias</label>
                  <input id="fim-ferias" name="fimFerias" type="date" />
                </div>
              </div>

              <p id="conflict-warning" class="conflict-warning hidden" aria-live="polite"></p>

              <div class="actions">
                <button class="button button-secondary" type="button" id="back-to-selection">Voltar</button>
                <button class="button button-primary" type="submit">Registrar solicitação</button>
              </div>

              <p id="submit-message" class="message" aria-live="polite"></p>
            </form>
          </div>
        </div>
      </main>
    </div>

    <script src="config.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-sync.js"></script>
    <script>
      const loggedUser = sessionStorage.getItem('brisa-demo-user');
      let serverProfile = null;
      try {
        serverProfile = JSON.parse(sessionStorage.getItem('brisa-demo-profile') || 'null');
      } catch {}
      // Perfil vindo do Google: nome e e-mail sempre presentes, mas o login
      // só-Google não coleta CPF. Busca o servidor já cadastrado pelo e-mail;
      // se não existir, o próprio usuário informa o CPF no formulário.
      let autoName = String(serverProfile?.name || '').trim();
      const googleEmail = String(serverProfile?.email || '').trim().toLowerCase();
      let autoCpf = String(serverProfile?.cpf || '').trim();
      try {
        const registry = JSON.parse(localStorage.getItem('brisa-server-personal-data-v1') || '[]');
        const record = (Array.isArray(registry) ? registry : []).find(item =>
          googleEmail && String(item.email || '').trim().toLowerCase() === googleEmail
        );
        if (record) {
          if (!autoName) autoName = String(record.name || '').trim();
          if (!autoCpf) autoCpf = String(record.cpf || '').trim();
        }
      } catch {}

      let isFgServer = false;
      try {
        const fgRoster = JSON.parse(localStorage.getItem('brisa-fg-server-roster-v1') || '[]');
        const normalizeCpf = value => String(value || '').replace(/\D/g, '');
        const normalizedCpf = normalizeCpf(autoCpf);
        const normalizedName = autoName.toLocaleLowerCase('pt-BR');
        isFgServer = Array.isArray(fgRoster) && fgRoster.some(entry => {
          if (typeof entry === 'string') return entry.trim().toLocaleLowerCase('pt-BR') === normalizedName;
          if (!entry || typeof entry !== 'object') return false;
          const rosterCpf = normalizeCpf(entry.cpf);
          return (normalizedCpf && rosterCpf && rosterCpf === normalizedCpf)
            || String(entry.name || '').trim().toLocaleLowerCase('pt-BR') === normalizedName;
        });
      } catch {}
      const nameInput = document.getElementById('nome');
      const cpfInput = document.getElementById('cpf');
      const emailInput = document.getElementById('email');
      const hasIdentity = Boolean(autoName) && (Boolean(autoCpf) || Boolean(googleEmail));
      // O administrador também pode abrir o formulário (item "Fazer solicitação"
      // no menu do painel), desde que tenha nome/e-mail na sessão (login Google).
      if ((loggedUser !== 'usuario' && loggedUser !== 'admin') || !hasIdentity) {
        window.location.replace('login.html');
      } else {
        nameInput.value = autoName;
        nameInput.readOnly = true;
        cpfInput.value = autoCpf;
        cpfInput.readOnly = Boolean(autoCpf);
        cpfInput.placeholder = autoCpf ? '000.000.000-00' : 'Informe seu CPF (obrigatório)';
        if (emailInput && googleEmail) emailInput.value = googleEmail;
        document.getElementById('user-name').textContent = autoName;
        document.getElementById('user-avatar').textContent = autoName.trim().charAt(0).toLocaleUpperCase('pt-BR');
      }

      const selectionPanel = document.getElementById('selection-panel');
      const formPanel = document.getElementById('form-panel');
      const formTitle = document.getElementById('form-title');
      const formSubtitle = document.getElementById('form-subtitle');
      const submitMessage = document.getElementById('submit-message');
      const cycleField = document.getElementById('cycle-field');
      const cycleSelect = document.getElementById('ciclo');
      const monthField = document.getElementById('data-ferias').closest('.field');
      const monthSelect = document.getElementById('data-ferias');
      const vacationPeriodFields = document.querySelectorAll('.vacation-period-field');
      const vacationStartInput = document.getElementById('inicio-ferias');
      const vacationEndInput = document.getElementById('fim-ferias');
      const functionField = document.getElementById('function-field');
      const functionInput = document.getElementById('funcao-exercida');
      const substituteField = document.getElementById('substitute-field');
      const substituteInput = document.getElementById('substituto');
      const otherTypeField = document.getElementById('other-type-field');
      const otherTypeInput = document.getElementById('tipo-outros');
      const monthLabel = document.getElementById('data-ferias-label');
      const periodStartLabel = document.getElementById('inicio-ferias-label');
      const periodEndLabel = document.getElementById('fim-ferias-label');
      // Campos da Função Gratificada (FG). Precisam ser declarados aqui: antes o
      // script referenciava estas variáveis sem as declarar, o que lançava
      // ReferenceError em nível de topo e interrompia TODO o restante do script
      // (cliques, ?tipo= e o carregamento das unidades).
      // A pergunta "Possui Função Gratificada?" (fg-flag-field / #possui-fg)
      // aparece em todos os tipos de solicitação.
      const fgFlagSelect = document.getElementById('possui-fg');
      // O campo de Função Gratificada é uma lista suspensa Sim/Não; valor vazio = Não.
      const fgFlagSelected = () => Boolean(fgFlagSelect && fgFlagSelect.value === 'sim');
      // Lista de funções gratificadas compartilhada com o painel (config.js).
      // Se o config não trouxer a lista, mantém as opções que já estão no HTML.
      const fgFunctionSelect = document.getElementById('funcao-exercida');
      if (fgFunctionSelect) {
        const configuredFunctions = (window.RH_CONFIG && Array.isArray(window.RH_CONFIG.fgFunctions))
          ? window.RH_CONFIG.fgFunctions.map(value => String(value || '').trim()).filter(Boolean)
          : [];
        if (configuredFunctions.length) {
          fgFunctionSelect.innerHTML = '<option value="">Selecione a função exercida</option>'
            + configuredFunctions.map(value => `<option value="${value}">${value}</option>`).join('');
        }
      }

      let currentOption = 'ferias';

      const optionConfig = {
        ferias: { title: 'Férias', subtitle: 'Preencha os dados abaixo para encaminhar sua solicitação de férias.', mode: 'vacation' },
        premio: { title: 'Licença Prêmio', subtitle: 'Preencha os dados abaixo para encaminhar sua solicitação de licença prêmio.', mode: 'cycle' },
        capacitacao: { title: 'Licença Capacitação', subtitle: 'Preencha os dados abaixo para encaminhar sua solicitação de licença capacitação.', mode: 'cycle' },
        medica: { title: 'Licença Médica', subtitle: 'Preencha os dados abaixo para encaminhar sua solicitação de licença médica.', mode: 'period' },
        outros: { title: 'Outros', subtitle: 'Descreva o tipo de solicitação e informe o período desejado.', mode: 'period', specify: true }
      };

      const getOptionConfig = option => optionConfig[option] || optionConfig.ferias;

      const openForm = (option) => {
        const config = getOptionConfig(option);
        const mode = config.mode;
        const isCycle = mode === 'cycle';
        const isVacation = mode === 'vacation';
        const usesPeriod = mode === 'vacation' || mode === 'period';
        currentOption = option;

        // Mostra o formulário e garante que o painel de seleção fica oculto
        if (selectionPanel) selectionPanel.classList.add('hidden');
        if (formPanel) formPanel.classList.remove('hidden');

        formTitle.textContent = config.title;

        // O bloco de Função Gratificada vale para TODOS os tipos de solicitação
        // (férias, licença prêmio, capacitação, médica e outras): quem exerce
        // função gratificada também precisa informar a função e o substituto.
        if (fgFlagSelect) {
          fgFlagSelect.value = isFgServer ? 'sim' : '';
        }

        const showFgFieldsInitial = isFgServer || fgFlagSelected();
        formSubtitle.textContent = showFgFieldsInitial
          ? `${config.subtitle} Como servidor com Função Gratificada, informe também a função exercida e o substituto.`
          : config.subtitle;

        cycleField.classList.toggle('hidden', !isCycle);
        cycleSelect.required = isCycle;
        monthField.classList.toggle('hidden', !usesPeriod);
        monthSelect.required = usesPeriod;
        monthLabel.textContent = isVacation ? 'Mês de férias' : 'Mês de referência';
        vacationPeriodFields.forEach(field => field.classList.toggle('hidden', !usesPeriod));
        vacationStartInput.required = usesPeriod;
        vacationEndInput.required = usesPeriod;
        periodStartLabel.textContent = isVacation ? 'Início das férias' : 'Início';
        periodEndLabel.textContent = isVacation ? 'Fim das férias' : 'Término';
        otherTypeField.classList.toggle('hidden', !config.specify);
        otherTypeInput.required = Boolean(config.specify);
        if (!config.specify) otherTypeInput.value = '';
        // Recalcula caso o usuário marque/desmarque a caixa
        let finalShowFgFields = isFgServer || fgFlagSelected();
        functionField.classList.toggle('hidden', !finalShowFgFields);
        functionInput.required = finalShowFgFields;
        if (!finalShowFgFields) functionInput.value = '';
        substituteField.classList.toggle('hidden', !finalShowFgFields);
        substituteInput.required = finalShowFgFields;
        if (!finalShowFgFields) substituteInput.value = '';

        if (cycleSelect && !isCycle) cycleSelect.value = '';
        if (monthSelect && !usesPeriod) monthSelect.value = '';
      };

      document.querySelectorAll('.tab-link').forEach(tab => {
        tab.addEventListener('click', () => {
          document.querySelectorAll('.tab-link').forEach(item => item.classList.toggle('active', item === tab));
          openForm(tab.dataset.option);
        });
      });

      // Atualiza campos de FG ao alternar o checkbox manual
      if (fgFlagSelect) {
        fgFlagSelect.addEventListener('change', () => {
          const finalShow = isFgServer || fgFlagSelected();
          functionField.classList.toggle('hidden', !finalShow);
          functionInput.required = finalShow;
          substituteField.classList.toggle('hidden', !finalShow);
          substituteInput.required = finalShow;
        });
      }

      // Garante que ao clicar em qualquer botão de opção o form abre corretamente
      document.querySelectorAll('.option-card').forEach(card => {
        card.addEventListener('click', () => {
          const option = card.dataset.option;
          if (option && optionConfig[option]) {
            const requestedTab = document.querySelector(`.tab-link[data-option="${option}"]`);
            document.querySelectorAll('.tab-link').forEach(item => item.classList.toggle('active', item === requestedTab));
            openForm(option);
          }
        });
      });

      // Permite abrir direto em um tipo, vindo do menu "Fazer solicitação" do painel
      // (ex.: solicitacao-ferias.html?tipo=medica).
      const requestedType = new URLSearchParams(window.location.search).get('tipo');
      if (requestedType && optionConfig[requestedType]) {
        const requestedTab = document.querySelector(`.tab-link[data-option="${requestedType}"]`);
        document.querySelectorAll('.tab-link').forEach(item => item.classList.toggle('active', item === requestedTab));
        openForm(requestedType);
      } else {
        // Se não tiver ?tipo=..., mostra o painel de seleção? Não existe — então
        // abre diretamente o formulário de férias (comportamento mais estável).
        const requestedTab = document.querySelector(`.tab-link[data-option="ferias"]`);
        if (requestedTab) {
          document.querySelectorAll('.tab-link').forEach(item => item.classList.toggle('active', item === requestedTab));
        }
        openForm('ferias');
      }

      document.getElementById('back-to-selection').addEventListener('click', () => {
        if (formPanel) formPanel.classList.add('hidden');
        if (selectionPanel) selectionPanel.classList.add('hidden');
        if (cycleSelect) cycleSelect.value = '';
        if (monthSelect) { monthSelect.value = ''; monthSelect.required = true; }
        if (monthField) monthField.classList.remove('hidden');
        if (submitMessage) submitMessage.textContent = '';
      });

      document.getElementById('vacation-form').addEventListener('submit', async function (event) {
        event.preventDefault();

        if ((loggedUser !== 'usuario' && loggedUser !== 'admin') || !autoName) {
          window.location.replace('login.html');
          return;
        }

        const config = getOptionConfig(currentOption);
        const isCycle = config.mode === 'cycle';
        const usesPeriod = config.mode === 'vacation' || config.mode === 'period';

        if (isCycle && !cycleSelect.value) {
          cycleSelect.focus();
          cycleSelect.reportValidity();
          return;
        }

        if (config.specify && !otherTypeInput.value.trim()) {
          otherTypeInput.setCustomValidity('Descreva o tipo de solicitação.');
          otherTypeInput.reportValidity();
          otherTypeInput.focus();
          return;
        }
        if (config.specify) otherTypeInput.setCustomValidity('');

        const nome = nameInput.value.trim() || autoName;
        const emailUsuario = (emailInput && emailInput.value.trim()) || googleEmail;
        const cpf = cpfInput.value.trim();
        const unidade = document.getElementById('unidade').value.trim();
        const equipe = document.getElementById('equipe').value.trim();
        // Função exercida e substituto são recolhidos em qualquer tipo de
        // solicitação (o bloco de FG aparece em todas as abas).
        const funcaoExercida = functionInput.value.trim();
        const substituto = substituteInput.value.trim();
        const dataSolicitacao = usesPeriod ? monthSelect.value : '';
        const inicioFerias = usesPeriod ? vacationStartInput.value : '';
        const fimFerias = usesPeriod ? vacationEndInput.value : '';
        if (usesPeriod && (!inicioFerias || !fimFerias || fimFerias < inicioFerias)) {
          submitMessage.textContent = 'Informe um período válido para a solicitação.';
          vacationStartInput.reportValidity();
          if (inicioFerias && fimFerias < inicioFerias) vacationEndInput.focus();
          return;
        }
        const tipoSolicitacao = config.specify && otherTypeInput.value.trim()
          ? otherTypeInput.value.trim()
          : config.title;
        const ciclo = isCycle ? cycleSelect.value : '';
        const storageKey = 'brisa-vacation-requests-v1';

        const initials = nome
          .split(/\s+/)
          .filter(Boolean)
          .slice(0, 2)
          .map(part => part[0]?.toUpperCase() || '')
          .join('') || 'US';

        const request = {
          id: `user-${Date.now()}`,
          person: nome,
          initials,
          color: '#6a7782',
          start: inicioFerias || '',
          end: fimFerias || '',
          month: dataSolicitacao,
          days: inicioFerias && fimFerias ? Math.round((new Date(`${fimFerias}T12:00:00`) - new Date(`${inicioFerias}T12:00:00`)) / 86400000) + 1 : 1,
          note: [tipoSolicitacao, equipe, unidade, isCycle ? `Ciclo ${ciclo}` : (dataSolicitacao ? `Mês de ${dataSolicitacao}` : '')].filter(Boolean).join(' • '),
          created: 'Agora',
          status: 'pending',
          type: tipoSolicitacao.toLowerCase(),
          source: 'user',
          createdAt: new Date().toISOString(),
          email: emailUsuario,
          cpf,
          unidade,
          equipe,
          ciclo
        };
        if (funcaoExercida) request.funcaoExercida = funcaoExercida;
        if (substituto) request.substituto = substituto;
        request.temFG = !!(fgFlagSelected() || funcaoExercida || substituto || isFgServer);

        try {
          const existing = JSON.parse(localStorage.getItem(storageKey) || '[]');
          existing.unshift(request);
          localStorage.setItem(storageKey, JSON.stringify(existing));
        } catch (error) {
          console.warn('Não foi possível salvar a solicitação no armazenamento local:', error);
        }

        if (window.RH_SYNC && window.RH_SYNC.enabled) {
          window.RH_SYNC.waitForAuth().then(user => {
            if (!user) return; // sem sessão: mantém apenas local por enquanto
            return window.RH_SYNC.addRequest(request);
          }).then(() => {
            submitMessage.classList.remove('error');
          }).catch(error => {
            console.warn('Não foi possível enviar a solicitação online:', error);
            // Sem este aviso o pedido ficaria só neste navegador, sem o usuário saber.
            submitMessage.textContent = 'Atenção: a solicitação foi registrada, mas NÃO foi salva na nuvem. Verifique a internet, envie o e-mail e avise a Central de Recursos Humanos.';
            submitMessage.classList.add('error');
          });
        }

        // Enriquecimento automático dos cadastros com base na solicitação
        try {
          const cpfDigits = String(cpf).replace(/\D/g, '');
          const temFGAtual = !!(fgFlagSelected() || funcaoExercida || substituto || isFgServer);
          const normalizarTexto = text => String(text || '').trim();

          // Cadastro de Dados dos Servidores
          if (cpfDigits || nome) {
            const serverDataKey = 'brisa-server-personal-data-v1';
            let serverDataList = [];
            try { serverDataList = JSON.parse(localStorage.getItem(serverDataKey) || '[]'); } catch {}
            if (!Array.isArray(serverDataList)) serverDataList = [];
            const existente = serverDataList.find(item => {
              const itemCpf = String(item && item.cpf || '').replace(/\D/g, '');
              if (cpfDigits && itemCpf === cpfDigits) return true;
              if (!cpfDigits && normalizarTexto(item.name) === normalizarTexto(nome)) return true;
              return false;
            });
            const registro = existente || { id: crypto.randomUUID() };
            if (normalizarTexto(nome) && !normalizarTexto(registro.name)) registro.name = normalizarTexto(nome);
            if (cpfDigits && !String(registro.cpf || '')) registro.cpf = cpf;
            if (unidade && !normalizarTexto(registro.unidadePenal)) registro.unidadePenal = unidade;
            if (equipe && !normalizarTexto(registro.equipe)) registro.equipe = equipe;
            if (emailUsuario && !normalizarTexto(registro.email)) registro.email = emailUsuario;
            if (!existente) serverDataList.push(registro);
            try { localStorage.setItem(serverDataKey, JSON.stringify(serverDataList)); } catch {}
          }

          // Cadastro de Servidores com Função Gratificada
          if (temFGAtual && (cpfDigits || nome)) {
            const fgKey = 'brisa-fg-server-roster-v1';
            let fgList = [];
            try { fgList = JSON.parse(localStorage.getItem(fgKey) || '[]'); } catch {}
            if (!Array.isArray(fgList)) fgList = [];
            const existenteFg = fgList.find(item => {
              const itemCpf = String(item && item.cpf || '').replace(/\D/g, '');
              if (cpfDigits && itemCpf === cpfDigits) return true;
              if (!cpfDigits && normalizarTexto(item.name) === normalizarTexto(nome)) return true;
              return false;
            });
            const slugBase = normalizarTexto(nome).toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
            const registroFg = existenteFg || { id: `fg-${slugBase || 'sem-nome'}`, name: normalizarTexto(nome) || nome, cpf: cpf };
            if (normalizarTexto(nome)) registroFg.name = normalizarTexto(nome);
            if (cpfDigits || cpf) registroFg.cpf = cpfDigits ? cpf : cpf;
            if (funcaoExercida) registroFg.funcaoExercida = funcaoExercida;
            if (substituto) registroFg.substituto = substituto;
            if (!existenteFg) fgList.push(registroFg);
            try { localStorage.setItem(fgKey, JSON.stringify(fgList)); } catch {}
          }
        } catch (e) {
          console.warn('Não foi possível enriquecer os cadastros automaticamente:', e);
        }

        // A solicitação é registrada no sistema (local + nuvem); o envio por
        // e-mail foi removido — o administrador acompanha tudo pelo painel.
        if (submitMessage) {
          submitMessage.classList.remove('error');
          submitMessage.textContent = 'Solicitação registrada com sucesso. Acompanhe o andamento pelo painel da Central de Recursos Humanos.';
        }

        this.reset();
        document.getElementById('nome').value = autoName;
        document.getElementById('cpf').value = cpf;
      });

      const logoutLink = document.querySelector('[data-logout]');
      if (logoutLink) {
        logoutLink.addEventListener('click', function (event) {
          event.preventDefault();
          sessionStorage.removeItem('brisa-demo-user');
          sessionStorage.removeItem('brisa-demo-username');
          sessionStorage.removeItem('brisa-demo-profile');
          window.location.href = 'login.html';
        });
      }

      // ---- Unidades dinâmicas e aviso de conflito de escala ----

      const unidadeSelect = document.getElementById('unidade');
      const equipeSelect = document.getElementById('equipe');
      const conflictWarning = document.getElementById('conflict-warning');
      let cloudRequests = null; // cache das solicitações da nuvem (para o aviso de conflito)

      // Preenche o campo "Unidade de Lotação" com as unidades cadastradas.
      //   1) Reserva local: usa o último cadastro salvo neste navegador, então o
      //      dropdown nunca fica vazio (mesmo sem sessão/nuvem no momento).
      //   2) Nuvem: quando a leitura funciona, substitui pela coleção "unidades".
      const unidadesCacheKey = 'brisa-unidades-nomes-v1';
      const unidadesCadastroKey = 'brisa-unidades-v2';

      function normalizeUnidadesNomes(lista) {
        const nomes = (Array.isArray(lista) ? lista : [])
          .map(item => {
            if (typeof item === 'string') return item;
            return String((item && (item.name || item.nome)) || '');
          })
          .map(nome => nome.trim())
          .filter(Boolean);
        return Array.from(new Set(nomes)).sort((a, b) => a.localeCompare(b, 'pt-BR'));
      }

      function loadUnidadesFromCache() {
        let nomes = [];
        try {
          nomes = normalizeUnidadesNomes(JSON.parse(localStorage.getItem(unidadesCacheKey) || '[]'));
        } catch {}
        if (!nomes.length) {
          // Segunda reserva: o cadastro do painel salvo neste navegador.
          try {
            nomes = normalizeUnidadesNomes(JSON.parse(localStorage.getItem(unidadesCadastroKey) || '[]'));
          } catch {}
        }
        if (nomes.length) populateUnidades(nomes);
      }

      function saveUnidadesCache(nomes) {
        try {
          localStorage.setItem(unidadesCacheKey, JSON.stringify(nomes));
        } catch {}
      }

      function populateUnidades(nomes) {
        if (!unidadeSelect || !Array.isArray(nomes) || !nomes.length) return;
        const atual = unidadeSelect.value;
        unidadeSelect.innerHTML = '';
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Selecione a unidade penal';
        unidadeSelect.appendChild(placeholder);
        nomes.forEach(nome => {
          const option = document.createElement('option');
          option.value = nome;
          option.textContent = nome;
          unidadeSelect.appendChild(option);
        });
        if (atual) unidadeSelect.value = atual;
      }

      // Lê as unidades da nuvem usando o MESMO mecanismo do painel
      // (subscribeDocs / tempo real), que não depende de esperar a sessão.
      // Se não existir, cai para a leitura única (loadDocs).
      function loadUnidadesFromCloud() {
        if (!(window.RH_SYNC && window.RH_SYNC.enabled)) return;
        const aplicar = lista => {
          const unicos = normalizeUnidadesNomes(lista);
          if (unicos.length) {
            populateUnidades(unicos);
            saveUnidadesCache(unicos);
          }
        };
        if (typeof window.RH_SYNC.subscribeDocs === 'function') {
          try {
            window.RH_SYNC.subscribeDocs('unidades', aplicar, error => {
              console.warn('Assinatura de unidades falhou; usando a lista local.', error);
            });
            return;
          } catch (error) {
            console.warn('Não foi possível assinar as unidades; tentando leitura única.', error);
          }
        }
        Promise.resolve(window.RH_SYNC.loadDocs('unidades')).then(aplicar).catch(error => {
          console.warn('Não foi possível carregar as unidades da nuvem; usando a lista local.', error);
        });
      }

      // Mesma ideia para as solicitações usadas no aviso de conflito.
      function loadRequestsForConflictCheck() {
        if (!(window.RH_SYNC && window.RH_SYNC.enabled)) return;
        if (typeof window.RH_SYNC.subscribeRequests === 'function') {
          try {
            window.RH_SYNC.subscribeRequests(
              lista => { cloudRequests = Array.isArray(lista) ? lista : []; },
              error => console.warn('Assinatura de solicitações falhou; usando a lista local.', error)
            );
            return;
          } catch (error) {
            console.warn('Não foi possível assinar as solicitações; tentando leitura única.', error);
          }
        }
        Promise.resolve(window.RH_SYNC.loadRequests()).then(lista => {
          cloudRequests = Array.isArray(lista) ? lista : [];
        }).catch(error => {
          console.warn('Não foi possível carregar as solicitações para o aviso de conflito.', error);
        });
      }

      // Avisa (sem bloquear) quando outra pessoa da mesma equipe já tem
      // solicitação no período escolhido.
      function checkScheduleConflict() {
        if (!conflictWarning) return;
        conflictWarning.classList.add('hidden');
        conflictWarning.textContent = '';
        if (!Array.isArray(cloudRequests) || !cloudRequests.length) return;

        const config = getOptionConfig(currentOption);
        const usesPeriod = config.mode === 'vacation' || config.mode === 'period';
        if (!usesPeriod) return;

        const equipe = equipeSelect ? equipeSelect.value.trim() : '';
        const inicio = vacationStartInput ? vacationStartInput.value : '';
        const fim = vacationEndInput ? vacationEndInput.value : '';
        if (!equipe || !inicio || !fim || fim < inicio) return;

        const overlaps = cloudRequests.filter(item => {
          if (!item || String(item.equipe || '').trim() !== equipe) return false;
          const status = String(item.status || '').toLowerCase();
          if (status === 'rejected' || status === 'recusada') return false;
          if (String(item.person || '').trim() === autoName) return false; // ignora o próprio solicitante
          const start = String(item.start || '');
          const end = String(item.end || '');
          if (!start || !end) return false;
          return inicio <= end && start <= fim;
        });

        if (!overlaps.length) return;
        const nomes = Array.from(new Set(overlaps.map(item => String(item.person || '').trim()).filter(Boolean)));
        conflictWarning.textContent = `Atenção: ${nomes.join(', ')} da equipe ${equipe} já ${nomes.length === 1 ? 'tem' : 'têm'} solicitação no mesmo período. O pedido pode ser recusado por conflito de escala.`;
        conflictWarning.classList.remove('hidden');
      }

      if (equipeSelect) equipeSelect.addEventListener('change', checkScheduleConflict);
      if (vacationStartInput) vacationStartInput.addEventListener('change', checkScheduleConflict);
      if (vacationEndInput) vacationEndInput.addEventListener('change', checkScheduleConflict);

      loadUnidadesFromCache();
      loadUnidadesFromCloud();
      // Lista de funções gratificadas (mesma lista do painel): a coleção pública
      // "funcoesGratificadas" alimenta o campo "Função exercida". Sem nuvem, cai
      // para a reserva local (cadastro salvo neste navegador).
      const funcoesCacheKey = 'brisa-fg-functions-names-v1';
      const funcoesCadastroKey = 'brisa-fg-functions-v1';

      function normalizeFuncoesNomes(lista) {
        const nomes = (Array.isArray(lista) ? lista : [])
          .map(item => (typeof item === 'string' ? item : String((item && item.name) || '')))
          .map(nome => nome.trim())
          .filter(Boolean);
        return Array.from(new Set(nomes));
      }

      function saveFuncoesCache(nomes) {
        try {
          localStorage.setItem(funcoesCacheKey, JSON.stringify(nomes));
        } catch {}
      }

      function populateFuncoes(nomes) {
        if (!fgFunctionSelect || !Array.isArray(nomes) || !nomes.length) return;
        const atual = fgFunctionSelect.value;
        fgFunctionSelect.innerHTML = '';
        const placeholder = document.createElement('option');
        placeholder.value = '';
        placeholder.textContent = 'Selecione a função exercida';
        fgFunctionSelect.appendChild(placeholder);
        nomes.forEach(nome => {
          const option = document.createElement('option');
          option.value = nome;
          option.textContent = nome;
          fgFunctionSelect.appendChild(option);
        });
        if (atual) fgFunctionSelect.value = atual;
      }

      function loadFuncoesFromCache() {
        let nomes = [];
        try {
          nomes = normalizeFuncoesNomes(JSON.parse(localStorage.getItem(funcoesCadastroKey) || '[]'));
        } catch {}
        if (!nomes.length) {
          try {
            nomes = normalizeFuncoesNomes(JSON.parse(localStorage.getItem(funcoesCacheKey) || '[]'));
          } catch {}
        }
        if (nomes.length) populateFuncoes(nomes);
      }

      function loadFuncoesFromCloud() {
        if (!(window.RH_SYNC && window.RH_SYNC.enabled)) return;
        const aplicar = lista => {
          const unicos = normalizeFuncoesNomes(lista);
          if (unicos.length) {
            populateFuncoes(unicos);
            saveFuncoesCache(unicos);
          }
        };
        if (typeof window.RH_SYNC.subscribeDocs === 'function') {
          try {
            window.RH_SYNC.subscribeDocs('funcoesGratificadas', aplicar, error => {
              console.warn('Assinatura de funções gratificadas falhou; usando a lista local.', error);
            });
            return;
          } catch (error) {
            console.warn('Não foi possível assinar as funções gratificadas; tentando leitura única.', error);
          }
        }
        Promise.resolve(window.RH_SYNC.loadDocs('funcoesGratificadas')).then(aplicar).catch(error => {
          console.warn('Não foi possível carregar as funções gratificadas; usando a lista local.', error);
        });
      }

      loadFuncoesFromCache();
      loadFuncoesFromCloud();
      loadRequestsForConflictCheck();

      // Rede de segurança: se depois de alguns segundos a lista continuar vazia,
      // avisa o usuário (em vez de deixar o campo mudo e sem explicação).
      const unidadeAviso = document.getElementById('unidade-aviso');
      setTimeout(() => {
        if (!unidadeAviso || !unidadeSelect) return;
        if (unidadeSelect.options.length > 1) {
          unidadeAviso.classList.add('hidden');
          return;
        }
        unidadeAviso.textContent = 'Não foi possível carregar a lista de unidades. Verifique sua conexão e recarregue a página.';
        unidadeAviso.classList.remove('hidden');
      }, 4000);
    </script>
  </body>
</html>
