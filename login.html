<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#343b3e" />
    <title>Central de Recursos Humanos | Polícia Penal do Paraná</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="login.css" />
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="config.js"></script>
    <script src="config.local.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
    <script src="firebase-sync.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script src="login.js" defer></script>
  </head>
  <body>
    <main class="page-shell">
      <header class="portal-header">
        <div class="portal-header-inner">
          <a class="brand" href="index.html" aria-label="Polícia Penal do Paraná, início">
            <span class="brand-mark"><i data-lucide="shield-check"></i></span>
            <span class="brand-name">POLÍCIA PENAL<small>PARANÁ</small></span>
          </a>
        </div>
      </header>

      <div class="login-layout">
        <section class="identity-panel" aria-labelledby="identity-title">
          <div class="identity-copy">
            <p class="welcome-eyebrow"><span></span> PORTAL DE SERVIÇOS</p>
            <h1 id="identity-title">Central de Recursos Humanos<span>Polícia Penal do Paraná</span></h1>
            <p>Entre com suas credenciais para acessar o ambiente interno.</p>
          </div>
          <div class="identity-art">
            <img class="identity-crest" src="brasao_ok.png" alt="Brasão da Polícia Penal do Paraná" />
            <p>IDENTIDADE INSTITUCIONAL</p>
          </div>
        </section>

        <section class="form-panel" aria-labelledby="login-title">
          <div class="form-wrap">
            <div class="form-heading"><p class="form-eyebrow">ACESSO RESTRITO</p><h2 id="login-title">Entrar no sistema</h2><p id="login-description">Acesse com sua conta Google.</p></div>
            <div class="google-block" id="google-block" hidden>
              <div class="google-signin-button" id="google-signin-button"></div>
              <p class="form-message" id="google-message" role="status" aria-live="polite"></p>
            </div>
            </div>
        </section>
      </div>

      <footer class="portal-footer"><span>POLÍCIA PENAL DO PARANÁ</span><span>PARANÁ · BRASIL</span></footer>
    </main>
  </body>
</html>
